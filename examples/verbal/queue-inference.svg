<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" data-format="verbal" data-question-type="inference" data-option-count="5" aria-label="EPSO verbal item: Which conclusion is best supported by the passage?"><rect width="100%" height="100%" fill="#ffffff"/><text x="700" y="30" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#111827">1. inference</text><text x="700" y="58" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="normal" fill="#111827">Which conclusion is best supported by the passage?</text><text x="50" y="96" text-anchor="start" font-family="sans-serif" font-size="17" font-weight="bold" fill="#111827">Managing an urgent translation queue</text><text x="50" y="122" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="normal" fill="#111827">The Commission&#x27;s translation unit schedules urgent requests in a shared queue. Requests marked urgent are</text><text x="50" y="142" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="normal" fill="#111827">reviewed by a coordinator before translators are assigned.</text><text x="50" y="171" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="normal" fill="#111827">In June, 42 urgent requests entered the queue; 35 were assigned within two working days. The remainder</text><text x="50" y="191" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="normal" fill="#111827">waited for a specialist language pair.</text><text x="50" y="220" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="normal" fill="#111827">The unit introduced a daily capacity cap of 18 assignments to protect quality. The cap applies to all</text><text x="50" y="240" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="normal" fill="#111827">requests, not only urgent ones.</text><text x="50" y="420" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111827">Answer options</text><rect x="50" y="426" width="1300" height="42" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="66" y="453" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="normal" fill="#111827">A. The daily cap was designed to increase the number of assignments.</text><rect x="50" y="478" width="1300" height="42" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="66" y="505" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="normal" fill="#111827">B. Urgent requests bypass coordinator review.</text><rect x="50" y="530" width="1300" height="42" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="66" y="557" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="normal" fill="#111827">C. The capacity cap applies beyond urgent requests.</text><rect x="50" y="582" width="1300" height="42" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="66" y="609" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="normal" fill="#111827">D. The specialist language pair caused all queue delays.</text><rect x="50" y="634" width="1300" height="42" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="66" y="661" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="normal" fill="#111827">E. Every urgent request is assigned within two working days.</text></svg>
