<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" data-format="verbal" data-question-type="true-false" data-option-count="5" aria-label="EPSO verbal item: Which statement is true according to the passage?"><rect width="100%" height="100%" fill="#ffffff"/><text x="700" y="30" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#111827">1. true-false</text><text x="700" y="58" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="normal" fill="#111827">Which statement is true according to the passage?</text><text x="50" y="96" text-anchor="start" font-family="sans-serif" font-size="17" font-weight="bold" fill="#111827">What the river sensors can show</text><text x="50" y="122" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="normal" fill="#111827">The regional environment agency installed sensors at three river gauges in May. Each sensor records water</text><text x="50" y="142" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="normal" fill="#111827">level every 15 minutes and sends the readings to a central dashboard.</text><text x="50" y="171" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="normal" fill="#111827">During the summer drought, the level at the Willow gauge stayed below the agency&#x27;s alert threshold for</text><text x="50" y="191" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="normal" fill="#111827">nine days. Staff reviewed an alert before issuing any public bulletin.</text><text x="50" y="220" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="normal" fill="#111827">Heavy rain in September produced two alerts in three days, but neither led to a closure because the water</text><text x="50" y="240" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="normal" fill="#111827">level receded within four hours. The sensors report current levels; they do not predict rainfall.</text><text x="50" y="420" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111827">Answer options</text><rect x="50" y="426" width="1300" height="42" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="66" y="453" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="normal" fill="#111827">A. Both September alerts caused a river closure.</text><rect x="50" y="478" width="1300" height="42" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="66" y="505" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="normal" fill="#111827">B. All three gauges stayed below threshold for nine days.</text><rect x="50" y="530" width="1300" height="42" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="66" y="557" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="normal" fill="#111827">C. Sensors record readings only once a day.</text><rect x="50" y="582" width="1300" height="42" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="66" y="609" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="normal" fill="#111827">D. Staff review an alert before issuing a public bulletin.</text><rect x="50" y="634" width="1300" height="42" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="66" y="661" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="normal" fill="#111827">E. The sensors predict rainfall.</text></svg>
