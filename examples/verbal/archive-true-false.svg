<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" data-format="verbal" data-question-type="true-false" data-option-count="5" aria-label="EPSO verbal item: Which statement is true according to the passage?"><rect width="100%" height="100%" fill="#ffffff"/><text x="700" y="30" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#111827">1. true-false</text><text x="700" y="58" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="normal" fill="#111827">Which statement is true according to the passage?</text><text x="50" y="96" text-anchor="start" font-family="sans-serif" font-size="17" font-weight="bold" fill="#111827">The archive&#x27;s first digitisation phase</text><text x="50" y="122" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="normal" fill="#111827">The city archive prioritised maps dated before 1950 for its first digitisation phase. Each map is</text><text x="50" y="142" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="normal" fill="#111827">catalogued before scanning, and a quality check is completed before a public access copy is posted.</text><text x="50" y="171" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="normal" fill="#111827">In May, the team scanned 320 maps. Volunteers transcribed handwritten labels for 90 of those maps; the</text><text x="50" y="191" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="normal" fill="#111827">volunteers did not operate the scanners.</text><text x="50" y="220" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="normal" fill="#111827">The project creates digital access copies while the original maps remain in the archive reading room.</text><text x="50" y="420" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111827">Answer options</text><rect x="50" y="426" width="1300" height="42" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="66" y="453" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="normal" fill="#111827">A. Original maps were moved out of the reading room.</text><rect x="50" y="478" width="1300" height="42" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="66" y="505" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="normal" fill="#111827">B. Every map received a volunteer transcription.</text><rect x="50" y="530" width="1300" height="42" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="66" y="557" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="normal" fill="#111827">C. The team scanned 3,200 maps in May.</text><rect x="50" y="582" width="1300" height="42" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="66" y="609" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="normal" fill="#111827">D. Volunteers transcribed handwritten labels for 90 maps.</text><rect x="50" y="634" width="1300" height="42" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="66" y="661" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="normal" fill="#111827">E. Volunteers operated the scanners.</text></svg>
