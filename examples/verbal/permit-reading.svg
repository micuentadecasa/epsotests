<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" data-format="verbal" data-question-type="reading-comprehension" data-option-count="5" aria-label="EPSO verbal item: What must applicants still do at their appointment?"><rect width="100%" height="100%" fill="#ffffff"/><text x="700" y="30" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#111827">1. reading-comprehension</text><text x="700" y="58" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="normal" fill="#111827">What must applicants still do at their appointment?</text><text x="50" y="96" text-anchor="start" font-family="sans-serif" font-size="17" font-weight="bold" fill="#111827">A shorter visit to the permit office</text><text x="50" y="122" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="normal" fill="#111827">To reduce waiting time, the North District permit office introduced an online pre-check in April.</text><text x="50" y="142" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="normal" fill="#111827">Applicants may upload forms before visiting, but an officer still verifies original identity documents at</text><text x="50" y="162" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="normal" fill="#111827">the appointment.</text><text x="50" y="191" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="normal" fill="#111827">During the first six weeks, average counter time fell from 18 minutes to 11 minutes. The office handled</text><text x="50" y="211" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="normal" fill="#111827">14% more applications than in the same period last year.</text><text x="50" y="240" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="normal" fill="#111827">The office did not extend opening hours; it reassigned two clerks from filing to pre-checks.</text><text x="50" y="420" text-anchor="start" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111827">Answer options</text><rect x="50" y="426" width="1300" height="42" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="66" y="453" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="normal" fill="#111827">A. Attend an office that has extended its opening hours.</text><rect x="50" y="478" width="1300" height="42" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="66" y="505" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="normal" fill="#111827">B. Skip the appointment because the pre-check replaces identity checks.</text><rect x="50" y="530" width="1300" height="42" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="66" y="557" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="normal" fill="#111827">C. Wait at the counter for 18 minutes on average.</text><rect x="50" y="582" width="1300" height="42" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="66" y="609" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="normal" fill="#111827">D. Upload every form at the office rather than online.</text><rect x="50" y="634" width="1300" height="42" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="66" y="661" text-anchor="start" font-family="sans-serif" font-size="13" font-weight="normal" fill="#111827">E. Present original identity documents for verification.</text></svg>
