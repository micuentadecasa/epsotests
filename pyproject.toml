[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epsotests"
version = "0.1.0"
description = "Deterministic EPSO visual abstract, numerical, and verbal reasoning generators"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["epsotests*"]

[tool.setuptools.package-data]
epsotests = ["web/*.html", "web/*.css", "web/*.js"]

[project.scripts]
epsotests-visual = "epsotests.cli:main"
epsotests-numerical = "epsotests.cli:main"
epsotests-verbal = "epsotests.cli:main"
