[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epsotests"
version = "0.1.0"
description = "Deterministic EPSO visual abstract reasoning generator"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["epsotests*"]

[project.scripts]
epsotests-visual = "epsotests.cli:main"
epsotests-numerical = "epsotests.cli:main"
