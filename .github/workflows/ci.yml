name: epsotests CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: epsotests CI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install and test
        shell: bash
        run: |
          if [[ ( -f pyproject.toml || -f setup.py || -f setup.cfg ) && ( -d tests || -n "$(find . -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit)" ) ]]; then
            python -m pip install --editable .
            python -m pytest
          else
            echo "No package and test suite found; skipping editable install and pytest."
          fi
